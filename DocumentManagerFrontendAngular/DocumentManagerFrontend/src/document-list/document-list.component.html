<p-table #documentTable
         [value]="metadatas()"
         [rowHover]="true"
         [rows]="12"
         [showCurrentPageReport]="true"
         [rowsPerPageOptions]="[10,25,50]"
         currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
         [filterDelay]="0"
         [globalFilterFields]="['contact.name','title','date']"
         [resizableColumns]="true" styleClass="p-datatable-gridlines"
         [paginator]="true"
         [stateKey]="stateKey()"
         [stateStorage]="'local'"
         [filters]="filters()">
  <ng-template pTemplate="caption">
    <div class="table-header">List of Documents</div>
  </ng-template>
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="contact.name" pResizableColumn>Kontakt
        <p-sortIcon field="contact.name"></p-sortIcon>
        <p-columnFilter type="text" field="contact.name" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="title" pResizableColumn>Titel
        <p-sortIcon field="title"></p-sortIcon>
        <p-columnFilter type="text" field="title" display="menu"></p-columnFilter>
      </th>
      <th pSortableColumn="date" pResizableColumn>Datum
        <p-sortIcon field="date"></p-sortIcon>
        <p-columnFilter type="date" field="date" display="menu"></p-columnFilter>
      </th>
      <th pResizableColumn>Tags
        <p-columnFilter type="text" field="tags" display="menu"
                        [matchModeOptions]="tagMatchModes" matchMode="tagFilter">
        </p-columnFilter>
      </th>
      <th pResizableColumn>Gecheckt
        <p-columnFilter type="boolean" field="checked" display="menu"></p-columnFilter>
      </th>
      <th pResizableColumn>Link</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-document>
    <tr>
      <td>{{ document.contact?.name }}</td>
      <td>{{ document.title }}</td>
      <td>{{ document.date | date: 'dd.MM.yyyy' }}</td>
      <td>{{ document.tags | tagList }}</td>
      <td><input type="checkbox" [checked]="document.checked" disabled></td>
      <td><a [routerLink]="['..','document', document.id]" routerLinkActive="active">Öffnen</a></td>
    </tr>
  </ng-template>
</p-table>
